<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Slushie Style — a Slush Sisters toy</title>
<style>
/* ---------------------------------------------------------------------------
   SLUSHIE STYLE — dress Slushie up. Change the color, add a hat, glasses, a
   bow; tap for a pose. A toy, not a game: no score, no timer. Orphaned arcade
   page: noindex, no analytics, nothing collected, nothing saved off-device.
   All DOM + CSS + JS — no canvas, no libraries, no images.
--------------------------------------------------------------------------- */
:root{
  --brand:#1a237e; --ice:#4fc3f7; --ice-deep:#0277bd; --wash:#e8f4fd;
  --pop:#ff4081; --ink-pink:#c2185b; --good:#2e7d32; --slush:#7ed957;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Baloo 2',system-ui,-apple-system,sans-serif;color:var(--brand);
  background:linear-gradient(180deg,#f3e9fd 0%,#e9f2fd 50%,#fdeef5 100%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.stage{width:100%;max-width:480px;height:100%;margin:0 auto;position:relative;
  display:flex;flex-direction:column;padding:0 12px;}
button{font-family:inherit;cursor:pointer;}

.bar{display:flex;align-items:center;justify-content:space-between;padding:11px 4px 2px;}
.bar .wm{font-weight:800;font-size:1.05rem;}
.bar .wm span{color:var(--ice-deep);}
.bar a{color:var(--ice-deep);text-decoration:none;font-weight:800;font-size:.86rem;}

/* stage / character */
.scene{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;}
.char{position:relative;width:170px;height:210px;cursor:pointer;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1);}
.char.pose{animation:pose .5s;}
.bob{position:absolute;inset:0;animation:bob 3s ease-in-out infinite;}
.slot-hat{position:absolute;top:-30px;left:0;right:0;text-align:center;font-size:2.6rem;z-index:5;height:44px;}
.slot-extra{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:1.9rem;z-index:6;}
.straw2{position:absolute;top:6px;right:44px;width:9px;height:56px;background:var(--pop);border-radius:5px;transform:rotate(13deg);z-index:1;}
.body{position:absolute;left:10px;right:10px;top:34px;bottom:0;background:rgba(255,255,255,.5);
  border:5px solid var(--brand);border-radius:14px 14px 30px 30px;overflow:hidden;z-index:2;}
.slush{position:absolute;left:0;right:0;bottom:0;height:72%;background:var(--slush);transition:background .4s;}
.slush::before{content:"";position:absolute;top:-7px;left:0;right:0;height:14px;background:inherit;border-radius:50%;filter:brightness(1.07);}
.dome{position:absolute;top:18px;left:16px;right:16px;height:34px;background:var(--slush);
  border:5px solid var(--brand);border-radius:50% 50% 46% 46%;z-index:3;transition:background .4s;}
.face{position:absolute;left:0;right:0;top:80px;z-index:4;}
.eyes{display:flex;justify-content:center;gap:22px;position:relative;}
.eye{width:28px;height:32px;background:#fff;border:3px solid var(--brand);border-radius:50%;position:relative;overflow:hidden;}
.eye .pupil{position:absolute;width:13px;height:13px;background:var(--brand);border-radius:50%;left:50%;top:52%;transform:translate(-50%,-50%);}
.char.blink .eye{animation:blink .18s;}
.slot-glasses{position:absolute;top:-4px;left:0;right:0;text-align:center;font-size:2.1rem;z-index:5;pointer-events:none;}
.cheeks{display:flex;justify-content:center;gap:56px;margin-top:3px;}
.cheek{width:16px;height:12px;background:#ff8fa0;border-radius:50%;opacity:.6;}
.mouth{width:36px;height:18px;margin:6px auto 0;border:0 solid var(--brand);border-bottom-width:5px;border-radius:0 0 40px 40px;transition:all .18s;}
.char[data-face="cool"] .mouth{width:30px;height:8px;border-bottom-width:5px;transform:rotate(-6deg);}
.char[data-face="wow"] .mouth{width:22px;height:22px;border:5px solid var(--brand);border-radius:50%;}
.char[data-face="silly"] .mouth{width:34px;height:20px;border-bottom-width:6px;border-radius:0 0 40px 40px;background:var(--pop);}
.sparkle{position:absolute;font-size:1.3rem;opacity:0;z-index:7;}
.sparkle.go{animation:spk .8s ease;}

/* controls */
.tools{flex-shrink:0;padding:4px 2px 12px;}
.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tab{flex:1;border:none;border-radius:12px;padding:9px 4px;font-weight:800;font-size:.82rem;
  background:#fff;color:var(--brand);box-shadow:0 3px 0 rgba(26,35,126,.12);}
.tab.on{background:var(--ice-deep);color:#fff;box-shadow:0 3px 0 #01517f;}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;min-height:56px;}
.opt{border:none;border-radius:13px;height:52px;background:#fff;font-size:1.7rem;
  box-shadow:0 4px 0 rgba(26,35,126,.12);transition:transform .06s,box-shadow .06s;
  display:flex;align-items:center;justify-content:center;}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(26,35,126,.12);}
.opt.on{outline:3px solid var(--pop);}
.opt.sw{font-size:0;}
.acts{display:flex;gap:8px;margin-top:9px;}
.act{flex:1;border:none;border-radius:13px;height:48px;font-weight:800;font-size:.98rem;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .06s,box-shadow .06s;}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
.act.rand{background:var(--pop);box-shadow:0 4px 0 var(--ink-pink);}
.act.reset{background:#90a4bd;box-shadow:0 4px 0 #6c7d97;}
.hint{text-align:center;font-size:.8rem;font-weight:700;color:var(--ink-pink);min-height:16px;margin-bottom:6px;}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes pose{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-7deg) scale(1.05)}55%{transform:rotate(7deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
@keyframes spk{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;}}
@media(max-height:680px){.char{width:150px;height:186px;}}
</style>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/analytics.js" defer></script>
</head>
<body>
<div class="stage">
  <div class="bar">
    <a href="/play">‹ Arcade</a>
    <div class="wm">Slushie <span>Style</span></div>
    <a href="/" style="visibility:hidden">.</a>
  </div>

  <div class="scene">
    <div class="char" id="char" data-face="happy">
      <div class="sparkle" id="spk1" style="top:10px;left:6px;">✨</div>
      <div class="sparkle" id="spk2" style="top:30px;right:2px;">⭐</div>
      <div class="bob">
        <div class="slot-hat" id="slotHat"></div>
        <div class="straw2"></div>
        <div class="dome" id="dome"></div>
        <div class="body"><div class="slush" id="slush"></div></div>
        <div class="face">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
            <div class="slot-glasses" id="slotGlasses"></div>
          </div>
          <div class="cheeks"><div class="cheek"></div><div class="cheek"></div></div>
          <div class="mouth"></div>
        </div>
        <div class="slot-extra" id="slotExtra"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">Tap a tab, then dress Slushie up. Tap Slushie for a pose!</div>

  <div class="tools">
    <div class="tabs" id="tabs"></div>
    <div class="tray" id="tray"></div>
    <div class="acts">
      <button class="act rand" id="randBtn">🎲 Surprise me</button>
      <button class="act reset" id="resetBtn">Start over</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var AC=null;
  function tone(f,d,t,v){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.05;
    o.connect(g);g.connect(AC.destination);var x=AC.currentTime;o.start(x);
    g.gain.exponentialRampToValueAtTime(.0001,x+(d||.1));o.stop(x+(d||.1));}catch(e){}}
  function resume(){try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}

  var COLORS=['#7ed957','#3fb9ef','#ff8fa0','#ffc23d','#b06cf0','#ff5c72'];
  var CATS=[
    {id:'color', label:'Color',  slot:null,          opts:COLORS},
    {id:'hat',   label:'Hat',    slot:'slotHat',     opts:['','🎩','🧢','👑','🎀','🌸','🍓','🎓','⛑️']},
    {id:'eyes',  label:'Glasses',slot:'slotGlasses', opts:['','🕶️','👓','🥽']},
    {id:'extra', label:'Extra',  slot:'slotExtra',   opts:['','🎀','👔','🧣','🌈','💖']},
    {id:'face',  label:'Face',   slot:null,          opts:['happy','cool','wow','silly']}
  ];
  var FACE_EMOJI={happy:'😊',cool:'😎',wow:'😮',silly:'😝'};
  var state={color:'#7ed957',hat:'',eyes:'',extra:'',face:'happy'};
  var activeCat='color';

  function applyState(){
    document.documentElement.style.setProperty('--slush', state.color);
    $('slush').style.background=state.color; $('dome').style.background=state.color;
    $('slotHat').textContent=state.hat;
    $('slotGlasses').textContent=state.eyes;
    $('slotExtra').textContent=state.extra;
    $('char').setAttribute('data-face', state.face);
  }

  function renderTabs(){
    var host=$('tabs'); host.innerHTML='';
    CATS.forEach(function(c){
      var b=document.createElement('button');
      b.className='tab'+(c.id===activeCat?' on':''); b.textContent=c.label;
      b.addEventListener('click', function(){ activeCat=c.id; renderTabs(); renderTray(); });
      host.appendChild(b);
    });
  }
  function renderTray(){
    var cat=CATS.filter(function(c){return c.id===activeCat;})[0];
    var host=$('tray'); host.innerHTML='';
    cat.opts.forEach(function(o){
      var b=document.createElement('button'); b.className='opt';
      if(cat.id==='color'){ b.classList.add('sw'); b.style.background=o; if(state.color===o) b.classList.add('on'); }
      else if(cat.id==='face'){ b.textContent=FACE_EMOJI[o]; if(state.face===o) b.classList.add('on'); }
      else { b.textContent=o===''?'🚫':o; if(state[cat.id]===o) b.classList.add('on'); }
      b.addEventListener('click', function(){ choose(cat, o); });
      host.appendChild(b);
    });
  }
  function choose(cat,o){
    resume();
    if(cat.id==='color') state.color=o;
    else if(cat.id==='face') state.face=o;
    else state[cat.id]=o;
    applyState(); renderTray();
    tone(o===''?300:520+Math.random()*160,.08,'triangle');
    setHint('Looking good! Try another, or tap Slushie.');
  }

  function pose(){
    resume();
    var ch=$('char'); ch.classList.remove('pose'); void ch.offsetWidth; ch.classList.add('pose');
    $('spk1').classList.remove('go'); $('spk2').classList.remove('go'); void ch.offsetWidth;
    $('spk1').classList.add('go'); $('spk2').classList.add('go');
    tone(660,.09,'triangle'); setTimeout(function(){tone(880,.1,'triangle');},90);
    setHint(pick(['Ta-da! 💁','Work it! 📸','So stylish!','Strike a pose!']));
  }
  function surprise(){
    resume();
    state.color=pick(COLORS);
    state.hat=pick(CATS[1].opts); state.eyes=pick(CATS[2].opts);
    state.extra=pick(CATS[3].opts); state.face=pick(CATS[4].opts);
    applyState(); renderTray();
    tone(500,.08); setTimeout(function(){tone(700,.08);},80); setTimeout(function(){tone(900,.1);},160);
    setHint('Surprise! 🎲 Tap again for another look.');
  }
  function reset(){
    state={color:'#7ed957',hat:'',eyes:'',extra:'',face:'happy'};
    applyState(); renderTray(); tone(300,.1,'square',.04); setHint('Fresh start. Dress Slushie up!');
  }

  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function setHint(t){ $('hint').textContent=t; }

  $('char').addEventListener('click', pose);
  $('randBtn').addEventListener('click', surprise);
  $('resetBtn').addEventListener('click', reset);
  setInterval(function(){ var ch=$('char'); ch.classList.remove('blink'); void ch.offsetWidth; ch.classList.add('blink'); }, 3400);

  renderTabs(); renderTray(); applyState();

  window.__style={ state:state, choose:function(cat,o){ choose(CATS.filter(function(c){return c.id===cat;})[0], o); },
    surprise:surprise, reset:reset, pose:pose, tab:function(id){activeCat=id;renderTabs();renderTray();} };
})();
</script>
</body>
</html>
