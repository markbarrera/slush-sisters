<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A neighborhood of little houses and a tree under a string of party flags">
  <!-- Community & events: the neighborhood, with bunting for a block party. -->

  <!-- sun -->
  <circle cx="280" cy="42" r="15" fill="#ffd24d" stroke="#1a237e" stroke-width="4"/>
  <g stroke="#1a237e" stroke-width="3" stroke-linecap="round">
    <path d="M280,20 v-7"/><path d="M300,30 l5,-5"/><path d="M301,52 l6,3"/>
  </g>

  <!-- bunting string with flags -->
  <path d="M28,44 Q160,66 292,40" fill="none" stroke="#1a237e" stroke-width="3"/>
  <g stroke="#1a237e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M56,49 l9,1 -4,12 Z" fill="#ff4081"/>
    <path d="M96,53 l9,1 -4,12 Z" fill="#4fc3f7"/>
    <path d="M136,55 l9,0 -4,12 Z" fill="#ffd24d"/>
    <path d="M176,55 l9,-1 -4,12 Z" fill="#86cf7a"/>
    <path d="M216,53 l9,-1 -4,12 Z" fill="#ff8fa0"/>
  </g>

  <!-- ground -->
  <path d="M32,150 H288" stroke="#1a237e" stroke-width="5" stroke-linecap="round"/>

  <!-- house 1 -->
  <rect x="54" y="94" width="74" height="56" rx="5" fill="#eaf6ff" stroke="#1a237e" stroke-width="5"/>
  <path d="M47,96 L91,60 L135,96 Z" fill="#4fc3f7" stroke="#1a237e" stroke-width="5" stroke-linejoin="round"/>
  <rect x="80" y="116" width="22" height="34" rx="3" fill="#ffd24d" stroke="#1a237e" stroke-width="4"/>
  <rect x="108" y="108" width="15" height="15" rx="3" fill="#fff" stroke="#1a237e" stroke-width="3.5"/>

  <!-- tree -->
  <circle cx="151" cy="118" r="18" fill="#86cf7a" stroke="#1a237e" stroke-width="4.5"/>

  <!-- house 2 -->
  <rect x="176" y="106" width="66" height="44" rx="5" fill="#fff" stroke="#1a237e" stroke-width="5"/>
  <path d="M169,108 L209,78 L249,108 Z" fill="#ff8fa0" stroke="#1a237e" stroke-width="5" stroke-linejoin="round"/>
  <rect x="199" y="122" width="20" height="28" rx="3" fill="#86cf7a" stroke="#1a237e" stroke-width="4"/>

  <!-- a cup on the ground, tying it back to the product -->
  <g transform="translate(266,116)">
    <path d="M-11,-14 L11,-14 L8,20 Q7,26 1,26 L-1,26 Q-7,26 -8,20 Z" fill="#fff" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-9,-2 L9,-2 L8,20 Q7,26 1,26 L-1,26 Q-7,26 -8,20 Z" fill="#ff4081"/>
    <rect x="3" y="-24" width="5" height="16" rx="2.5" fill="#4fc3f7" transform="rotate(12)"/>
    <circle cx="0" cy="-14" r="4" fill="#ffd24d" stroke="#1a237e" stroke-width="2.5"/>
  </g>
</svg>
