<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Dripping Springs: a red barn on rolling Hill Country with bluebonnets">
  <circle cx="272" cy="40" r="14" fill="#ffd24d" stroke="#1a237e" stroke-width="4"/>
  <g stroke="#1a237e" stroke-width="3" stroke-linecap="round"><path d="M272,19 v-6"/><path d="M292,30 l5,-5"/></g>
  <!-- rolling hills -->
  <path d="M0,140 Q90,100 190,134 Q250,152 320,122 L320,200 L0,200 Z" fill="#9ed98f" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M0,172 Q110,146 220,168 Q270,178 320,164 L320,200 L0,200 Z" fill="#6cbf6a" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
  <!-- barn -->
  <g transform="translate(150,104)">
    <rect x="-34" y="18" width="68" height="42" rx="2" fill="#ff5b6a" stroke="#1a237e" stroke-width="4.5"/>
    <path d="M-40,18 L-30,-2 L30,-2 L40,18 Z" fill="#ff8a95" stroke="#1a237e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-12,60 L-12,34 L12,34 L12,60" fill="#fff" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0,34 V60 M-12,47 H12" stroke="#1a237e" stroke-width="3"/>
    <path d="M0,-2 l8,8 -8,8 -8,-8 Z" fill="#fff" stroke="#1a237e" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
  <!-- bluebonnets -->
  <g>
    <g transform="translate(44,168)"><path d="M0,0 V22" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round"/><g fill="#3f51b5" stroke="#1a237e" stroke-width="2"><circle cx="0" cy="-2" r="3.5"/><circle cx="-4" cy="5" r="3.5"/><circle cx="4" cy="5" r="3.5"/><circle cx="0" cy="11" r="3.5"/></g></g>
    <g transform="translate(70,176)"><path d="M0,0 V18" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round"/><g fill="#3f51b5" stroke="#1a237e" stroke-width="2"><circle cx="0" cy="-2" r="3.5"/><circle cx="-4" cy="5" r="3.5"/><circle cx="4" cy="5" r="3.5"/></g></g>
    <g transform="translate(250,178)"><path d="M0,0 V16" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round"/><g fill="#3f51b5" stroke="#1a237e" stroke-width="2"><circle cx="0" cy="-2" r="3.5"/><circle cx="-4" cy="5" r="3.5"/><circle cx="4" cy="5" r="3.5"/></g></g>
  </g>
  <!-- cup -->
  <g transform="translate(292,150)">
    <rect x="0.5" y="-16" width="5" height="14" rx="2.5" fill="#ff4081" transform="rotate(12)"/>
    <path d="M-11,-11 L11,-11 L9,20 Q8,25 2,25 L-2,25 Q-8,25 -9,20 Z" fill="#fff" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-8.5,0 L8.5,0 L7,20 Q6,24 1,24 L-1,24 Q-7,24 -7,20 Z" fill="#86cf7a"/>
    <circle cx="0" cy="-11" r="4" fill="#ffd24d" stroke="#1a237e" stroke-width="2.4"/>
  </g>
</svg>
