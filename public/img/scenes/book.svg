<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A calendar with a date circled and checked, next to a frozen drink cup">
  <!-- Book your party: check your date. Calendar + a cup. -->
  <!-- rings -->
  <rect x="116" y="34" width="8" height="20" rx="4" fill="#fff" stroke="#1a237e" stroke-width="4"/>
  <rect x="180" y="34" width="8" height="20" rx="4" fill="#fff" stroke="#1a237e" stroke-width="4"/>
  <!-- body -->
  <rect x="92" y="46" width="120" height="104" rx="12" fill="#fff" stroke="#1a237e" stroke-width="5"/>
  <path d="M92,72 H212" stroke="#1a237e" stroke-width="4"/>
  <path d="M104,46 h96 a12,12 0 0 1 12,12 v14 H92 V58 a12,12 0 0 1 12,-12 Z" fill="#4fc3f7"/>
  <rect x="92" y="46" width="120" height="104" rx="12" fill="none" stroke="#1a237e" stroke-width="5"/>
  <!-- day dots -->
  <g fill="#cfe8fb">
    <circle cx="112" cy="92" r="6"/><circle cx="140" cy="92" r="6"/><circle cx="196" cy="92" r="6"/>
    <circle cx="112" cy="114" r="6"/><circle cx="168" cy="114" r="6"/><circle cx="196" cy="114" r="6"/>
    <circle cx="112" cy="134" r="6"/><circle cx="140" cy="134" r="6"/><circle cx="168" cy="134" r="6"/><circle cx="196" cy="134" r="6"/>
  </g>
  <!-- circled + checked day -->
  <circle cx="140" cy="114" r="13" fill="#86cf7a" stroke="#1a237e" stroke-width="4"/>
  <path d="M134,114 l4,4 8,-9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cup -->
  <g transform="translate(258,96)">
    <rect x="1" y="-30" width="6" height="20" rx="3" fill="#4fc3f7" transform="rotate(12)"/>
    <path d="M-14,-16 L14,-16 L11,26 Q10,32 3,32 L-3,32 Q-10,32 -11,26 Z" fill="#fff" stroke="#1a237e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-11,-2 L11,-2 L9,26 Q8,31 2,31 L-2,31 Q-8,31 -9,26 Z" fill="#ff4081"/>
    <circle cx="0" cy="-16" r="5" fill="#ffd24d" stroke="#1a237e" stroke-width="3"/>
  </g>

  <g fill="#4fc3f7"><path d="M232,54 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 Z"/></g>
</svg>
