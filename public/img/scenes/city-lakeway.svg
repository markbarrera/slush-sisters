<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Lakeway: a little home on green hills above Lake Travis with a sailboat">
  <circle cx="268" cy="44" r="15" fill="#ffd24d" stroke="#1a237e" stroke-width="4"/>
  <g stroke="#1a237e" stroke-width="3" stroke-linecap="round"><path d="M268,22 v-7"/><path d="M289,32 l5,-5"/><path d="M247,32 l-5,-5"/></g>
  <!-- back hill -->
  <path d="M0,150 Q80,96 175,132 Q250,160 320,116 L320,176 L0,176 Z" fill="#9ed98f" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
  <!-- home on the hill -->
  <g transform="translate(70,96)">
    <rect x="-16" y="0" width="32" height="26" rx="3" fill="#fff" stroke="#1a237e" stroke-width="4"/>
    <path d="M-22,2 L0,-16 L22,2 Z" fill="#ff8fa0" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-5" y="10" width="10" height="16" rx="2" fill="#ffd24d" stroke="#1a237e" stroke-width="3"/>
  </g>
  <!-- front hill hides back hill base -->
  <path d="M0,172 Q100,128 200,160 Q260,178 320,150 L320,200 L0,200 Z" fill="#6cbf6a" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
  <!-- water -->
  <path d="M0,178 Q80,170 160,178 T320,176 L320,200 L0,200 Z" fill="#4fc3f7" stroke="#1a237e" stroke-width="4"/>
  <!-- sailboat -->
  <g transform="translate(196,150)">
    <path d="M2,0 L2,-34 L26,-4 Z" fill="#fff" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-14,2 L20,2 L14,14 L-8,14 Z" fill="#ff4081" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- cup -->
  <g transform="translate(292,152)">
    <rect x="0.5" y="-16" width="5" height="14" rx="2.5" fill="#ff4081" transform="rotate(12)"/>
    <path d="M-11,-11 L11,-11 L9,20 Q8,25 2,25 L-2,25 Q-8,25 -9,20 Z" fill="#fff" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-8.5,0 L8.5,0 L7,20 Q6,24 1,24 L-1,24 Q-7,24 -7,20 Z" fill="#86cf7a"/>
    <circle cx="0" cy="-11" r="4" fill="#ffd24d" stroke="#1a237e" stroke-width="2.4"/>
  </g>
</svg>
