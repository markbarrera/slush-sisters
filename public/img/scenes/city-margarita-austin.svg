<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Austin skyline with a big lime slice and a frozen drink cup">
  <circle cx="280" cy="36" r="12" fill="#ffd24d" stroke="#1a237e" stroke-width="4"/>
  <!-- ground -->
  <path d="M0,176 H320" stroke="#1a237e" stroke-width="5" stroke-linecap="round"/>
  <!-- skyline silhouette -->
  <g fill="#4fc3f7" stroke="#1a237e" stroke-width="4.5" stroke-linejoin="round">
    <rect x="26" y="118" width="30" height="58" rx="3"/>
    <path d="M66,176 V104 L80,88 L94,104 V176 Z"/>
    <rect x="104" y="126" width="26" height="50" rx="3" fill="#86cf7a"/>
  </g>
  <!-- Capitol dome hint -->
  <g transform="translate(150,0)">
    <rect x="-24" y="132" width="48" height="44" rx="2" fill="#f4c9a0" stroke="#1a237e" stroke-width="4.5"/>
    <path d="M-16,132 Q0,100 16,132 Z" fill="#f0b98a" stroke="#1a237e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M0,100 V90" stroke="#1a237e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- big lime slice -->
  <g transform="translate(212,120)">
    <circle r="30" fill="#6cbf6a" stroke="#1a237e" stroke-width="5"/>
    <circle r="22" fill="#d8f0c0"/>
    <g stroke="#9ed98f" stroke-width="3" stroke-linecap="round">
      <path d="M0,0 V-18"/><path d="M0,0 L15,-10"/><path d="M0,0 H18"/><path d="M0,0 L15,10"/>
      <path d="M0,0 V18"/><path d="M0,0 L-15,10"/><path d="M0,0 H-18"/><path d="M0,0 L-15,-10"/>
    </g>
  </g>
  <!-- cup -->
  <g transform="translate(288,150)">
    <rect x="0.5" y="-16" width="5" height="14" rx="2.5" fill="#4fc3f7" transform="rotate(12)"/>
    <path d="M-11,-11 L11,-11 L9,20 Q8,25 2,25 L-2,25 Q-8,25 -9,20 Z" fill="#fff" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-8.5,0 L8.5,0 L7,20 Q6,24 1,24 L-1,24 Q-7,24 -7,20 Z" fill="#86cf7a"/>
    <circle cx="0" cy="-11" r="4" fill="#ffd24d" stroke="#1a237e" stroke-width="2.4"/>
  </g>
</svg>
