<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Lake Travis: a boat on open water below the Hill Country">
  <circle cx="266" cy="42" r="15" fill="#ffd24d" stroke="#1a237e" stroke-width="4"/>
  <g stroke="#1a237e" stroke-width="3" stroke-linecap="round"><path d="M266,20 v-7"/><path d="M287,30 l5,-5"/></g>
  <!-- hills -->
  <path d="M0,132 Q70,92 150,120 Q230,148 320,104 L320,150 L0,150 Z" fill="#9ed98f" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
  <!-- water -->
  <path d="M0,140 L320,140 L320,200 L0,200 Z" fill="#4fc3f7"/>
  <path d="M0,140 Q80,132 160,140 T320,138" fill="none" stroke="#1a237e" stroke-width="4"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M40,158 h26"/><path d="M96,172 h30"/><path d="M210,164 h28"/><path d="M256,180 h24"/></g>
  <!-- motorboat -->
