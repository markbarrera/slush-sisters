<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" role="img" aria-label="Two frozen drink cups with candy garnish">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd7fb"/><stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9ec0"/><stop offset="100%" stop-color="#ff4f8b"/>
    </linearGradient>
  </defs>
  <ellipse cx="260" cy="424" rx="185" ry="26" fill="#1a237e" opacity=".08"/>
  <!-- back cup (pink) -->
  <g transform="translate(340,215)">
    <rect x="26" y="-150" width="13" height="92" rx="6.5" fill="#ffd54f" transform="rotate(13)"/>
    <path d="M-62 -104 L62 -104 L48 118 L-48 118 Z" fill="#ffffff" opacity=".45"/>
    <path d="M-56 -46 L56 -46 L48 118 L-48 118 Z" fill="url(#pink)"/>
    <path d="M-62 -104 L62 -104 L58 -80 L-58 -80 Z" fill="#ffffff" opacity=".75"/>
    <circle cx="-20" cy="-14" r="11" fill="#fff" opacity=".5"/>
    <circle cx="14" cy="14" r="7" fill="#fff" opacity=".4"/>
  </g>
  <!-- front cup (blue) -->
  <g transform="translate(180,240)">
    <rect x="30" y="-176" width="15" height="104" rx="7.5" fill="#ff4081" transform="rotate(14)"/>
    <path d="M-76 -128 L76 -128 L58 142 L-58 142 Z" fill="#ffffff" opacity=".5"/>
    <path d="M-69 -56 L69 -56 L58 142 L-58 142 Z" fill="url(#blue)"/>
    <path d="M-76 -128 L76 -128 L71 -99 L-71 -99 Z" fill="#ffffff" opacity=".8"/>
    <circle cx="-26" cy="-16" r="14" fill="#fff" opacity=".55"/>
    <circle cx="16" cy="20" r="9" fill="#fff" opacity=".4"/>
    <circle cx="-6" cy="60" r="6" fill="#fff" opacity=".35"/>
  </g>
  <!-- candy garnish -->
  <circle cx="118" cy="104" r="15" fill="#ffd54f"/>
  <circle cx="118" cy="104" r="7" fill="#fff" opacity=".55"/>
  <circle cx="432" cy="70" r="11" fill="#4fc3f7"/>
  <circle cx="70" cy="196" r="8" fill="#ff4081" opacity=".8"/>
</svg>
