<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" role="img" aria-label="Slushie, the Slush Sisters cup character">
  <!-- "Slushie" — the brand character. A cup, never a child, so it stays about
       the product. Thick deep-blue outlines, candy-bright fills, a squishy
       lime slush. First pass: the girls are meant to draw over this. -->
  <defs>
    <clipPath id="cup"><path d="M50,90 L150,90 L136,205 Q134,222 117,222 L83,222 Q66,222 64,205 Z"/></clipPath>
  </defs>

  <!-- straw, behind the dome -->
  <g transform="rotate(15 122 55)">
    <rect x="116" y="16" width="13" height="78" rx="6.5" fill="#ff4081"/>
    <rect x="120.5" y="16" width="4" height="78" fill="#ffffff" opacity=".35"/>
  </g>

  <!-- cup glass -->
  <path d="M45,80 L155,80 L137,207 Q135,225 117,225 L83,225 Q65,225 63,207 Z"
        fill="#ffffff" fill-opacity=".55" stroke="#1a237e" stroke-width="5" stroke-linejoin="round"/>

  <!-- slush inside + frozen dome -->
  <g clip-path="url(#cup)">
    <rect x="45" y="96" width="110" height="140" fill="#86cf7a"/>
  </g>
  <path d="M48,86 Q52,58 73,61 Q81,45 100,51 Q119,45 127,61 Q148,58 152,86 Z"
        fill="#97d98b" stroke="#1a237e" stroke-width="5" stroke-linejoin="round"/>
  <!-- rim line over the fill -->
  <ellipse cx="100" cy="82" rx="55" ry="8.5" fill="none" stroke="#1a237e" stroke-width="5"/>

  <!-- lime-wedge garnish on the rim -->
  <g transform="rotate(-18 150 78)">
    <path d="M138,78 A12,12 0 0 1 162,78 Z" fill="#d8f0c0" stroke="#1a237e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M150,78 L150,66 M150,78 L140,72 M150,78 L160,72" stroke="#7ec97e" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- face -->
  <circle cx="72" cy="162" r="6.5" fill="#ff8fa0" opacity=".55"/>
  <circle cx="128" cy="162" r="6.5" fill="#ff8fa0" opacity=".55"/>
  <g>
    <ellipse cx="85" cy="150" rx="9" ry="11" fill="#fff" stroke="#1a237e" stroke-width="3"/>
    <ellipse cx="115" cy="150" rx="9" ry="11" fill="#fff" stroke="#1a237e" stroke-width="3"/>
    <circle cx="87" cy="152" r="4.2" fill="#1a237e"/>
    <circle cx="117" cy="152" r="4.2" fill="#1a237e"/>
    <circle cx="88.6" cy="150.4" r="1.4" fill="#fff"/>
    <circle cx="118.6" cy="150.4" r="1.4" fill="#fff"/>
  </g>
  <path d="M84,169 Q100,183 116,169" fill="none" stroke="#1a237e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- condensation -->
  <path d="M74,190 q-3,5 0,8 q3,-3 0,-8Z" fill="#bfe3f5"/>
  <path d="M126,196 q-2.5,4 0,6.5 q2.5,-2.5 0,-6.5Z" fill="#bfe3f5"/>
  <path d="M80,205 q-2,3.5 0,5.5 q2,-2 0,-5.5Z" fill="#bfe3f5"/>
</svg>
